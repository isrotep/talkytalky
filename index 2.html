<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PR27">
<meta name="theme-color" content="#231f1c">
<title>PR27</title>
<style>
  :root{
    --housing:#2b2621; --housing-hi:#3a342d; --housing-lo:#1b1815;
    --bezel:#12100e; --glass:#160f05;
    --amber:#f2a63b; --amber-dim:#7a5320;
    --lamp:#e2452b; --label:#b9ada0; --label-dim:#7a7168; --grille:#191613;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--housing-lo);color:var(--label);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;overscroll-behavior:none;
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .set{
    width:100%;max-width:430px;display:flex;flex-direction:column;
    background:linear-gradient(178deg,var(--housing-hi),var(--housing) 22%,var(--housing) 78%,var(--housing-lo));
    padding:18px 18px 22px;gap:15px;
  }
  .brand{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid #0e0c0a;padding-bottom:10px;box-shadow:0 1px 0 #423b33;
  }
  .brand b{font:700 19px/1 "Helvetica Neue",sans-serif;letter-spacing:.14em;color:#d8cdc0}
  .brand span{font-size:11px;color:var(--label-dim);letter-spacing:.06em}

  .display{
    background:var(--glass);border:1px solid var(--bezel);border-radius:5px;
    box-shadow:inset 0 3px 12px rgba(0,0,0,.9),inset 0 0 40px rgba(242,166,59,.06);
    padding:14px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;
  }
  .chan{
    font:700 60px/.82 ui-monospace,"SF Mono",Menlo,monospace;color:var(--amber);
    text-shadow:0 0 14px rgba(242,166,59,.45);font-variant-numeric:tabular-nums;
  }
  .chan small{font-size:12px;font-weight:400;letter-spacing:.1em;color:var(--amber-dim);display:block;margin-bottom:6px}
  .lamps{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  .lamp{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;color:#4d4238}
  .lamp i{width:9px;height:9px;border-radius:50%;background:#3a2a20;box-shadow:inset 0 1px 2px #000}
  .lamp.on{color:#f0c9a0}
  .lamp.on i{background:var(--lamp);box-shadow:0 0 9px var(--lamp)}
  .lamp.rx.on i{background:#4ad07a;box-shadow:0 0 9px #4ad07a}
  .status{
    grid-column:1/-1;margin-top:8px;padding-top:9px;border-top:1px solid #2a1c0a;
    font:400 12.5px/1.35 ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--amber);min-height:3.4em;white-space:pre-line;
    text-shadow:0 0 8px rgba(242,166,59,.3);
  }
  .status em{color:var(--amber-dim);font-style:normal}
  .status b{color:#ff8a6a;font-weight:400}

  .chanrow{display:flex;gap:10px;align-items:stretch}
  .knob{
    flex:0 0 58px;background:linear-gradient(160deg,#4a423a,#241f1a);
    border:1px solid #0f0d0b;border-radius:8px;color:#cdbfae;font-size:26px;font-weight:300;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 #131110,inset 0 1px 0 #5e544a;
  }
  .knob:active{box-shadow:inset 0 2px 6px #000;transform:translateY(1px)}
  .grille{
    flex:1;border-radius:8px;
    background:repeating-linear-gradient(90deg,var(--grille) 0 3px,#0b0a09 3px 6px);
    border:1px solid #0f0d0b;box-shadow:inset 0 2px 8px rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;letter-spacing:.1em;color:#544a41;text-align:center;padding:0 8px;
  }
  .roster{font-size:12px;color:var(--label-dim);display:flex;flex-wrap:wrap;gap:6px;min-height:22px;align-items:center}
  .roster b{font-weight:500;color:#cdbfae;background:#221e1a;border:1px solid #0f0d0b;border-radius:11px;padding:3px 10px}
  .roster b.tx{color:#f7d6b0;border-color:var(--lamp);background:#2e1c15}

  .ptt{
    margin-top:auto;height:124px;border-radius:14px;
    background:linear-gradient(180deg,#5c5348,#332c25 60%,#211c18);
    border:1px solid #100e0c;box-shadow:0 5px 0 #131110,inset 0 1px 0 #736758;
    color:#e6d9c8;font:600 17px/1.2 -apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;touch-action:none;
  }
  .ptt small{font-weight:400;font-size:12px;color:#9a8d7e}
  .ptt.live{
    background:linear-gradient(180deg,#8c3320,#5a1f12);
    box-shadow:0 1px 0 #131110,inset 0 3px 14px rgba(0,0,0,.6);
    transform:translateY(4px);color:#ffe6d8;
  }
  .ptt.live small{color:#e0a894}

  .row{display:flex;gap:8px}
  .row button{
    flex:1;padding:11px 6px;border-radius:8px;background:#241f1b;border:1px solid #0f0d0b;
    color:var(--label);font-size:12.5px;box-shadow:inset 0 1px 0 #3d362e;
  }
  .row button.act{color:#f2c98b;border-color:#5a4222}

  .setup{display:flex;flex-direction:column;gap:14px;justify-content:center;flex:1}
  .setup h1{font:700 26px/1.2 -apple-system,sans-serif;color:#d8cdc0}
  .setup p{font-size:14px;color:var(--label-dim);max-width:34ch}
  label{display:block;font-size:12px;color:var(--label-dim);margin-bottom:5px}
  input{
    width:100%;padding:13px 14px;font-size:16px;background:var(--glass);color:var(--amber);
    border:1px solid var(--bezel);border-radius:6px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;box-shadow:inset 0 2px 8px rgba(0,0,0,.8);
  }
  input:focus{outline:2px solid var(--amber-dim);outline-offset:1px}
  .go{
    padding:16px;border-radius:10px;border:1px solid #0f0d0b;
    background:linear-gradient(180deg,#5c5348,#332c25);color:#e6d9c8;
    font:600 16px/1 -apple-system,sans-serif;box-shadow:0 4px 0 #131110,inset 0 1px 0 #736758;
  }
  .go:active{transform:translateY(3px);box-shadow:0 1px 0 #131110}
  .hide{display:none!important}
  button{-webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer}
  button:focus-visible,.go:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="set">

  <div class="setup" id="setup">
    <h1>PR27</h1>
    <p>Családi hangcsatorna. Mindenki ugyanazt a családi kódot írja be, és ugyanarra a csatornára áll.</p>
    <div>
      <label for="nick">Hívónév</label>
      <input id="nick" maxlength="12" placeholder="pl. Peti" autocomplete="off" autocapitalize="words">
    </div>
    <div>
      <label for="room">Családi kód</label>
      <input id="room" maxlength="24" placeholder="pl. talkytalky-kovacs-87" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <button class="go" id="enter">Bekapcsolás</button>
    <p style="font-size:12px">Engedélyezd a mikrofont, és kapcsold ki a telefon némítását — az oldalsó kapcsoló ne legyen néma állásban.</p>
  </div>

  <div class="set hide" id="radio" style="padding:0;background:none;max-width:none;width:100%;gap:15px">
    <div class="brand"><b>PR27</b><span id="me">–</span></div>

    <div class="display">
      <div class="chan"><small>CSATORNA</small><span id="chNum">19</span></div>
      <div class="lamps">
        <div class="lamp tx" id="lampTx"><i></i>ADÁS</div>
        <div class="lamp rx" id="lampRx"><i></i>VÉTEL</div>
      </div>
      <div class="status" id="status"><em>Kapcsolódás…</em></div>
    </div>

    <div class="chanrow">
      <button class="knob" id="chDn" aria-label="Csatorna le">–</button>
      <div class="grille" id="grille">HANGSZÓRÓ</div>
      <button class="knob" id="chUp" aria-label="Csatorna fel">+</button>
    </div>

    <div class="roster" id="roster"></div>

    <div class="row">
      <button id="soundBtn">Hangpróba</button>
      <button id="testBtn">Önteszt</button>
      <button id="sqBtn" class="act">Zörej</button>
    </div>

    <button class="ptt" id="ptt">Tartsd nyomva<small>és beszélj</small></button>
  </div>
</div>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
(() => {
  "use strict";
  const BROKER  = "wss://broker.emqx.io:8084/mqtt";
  const MAX_MS  = 7000;
  const BITRATE = 32000;
  const HB_MS   = 4000;
  const GONE_MS = 12000;

  const $ = i => document.getElementById(i);
  const el = {
    setup:$("setup"), radio:$("radio"), nick:$("nick"), room:$("room"), enter:$("enter"),
    me:$("me"), chNum:$("chNum"), status:$("status"), lampTx:$("lampTx"), lampRx:$("lampRx"),
    chUp:$("chUp"), chDn:$("chDn"), roster:$("roster"), ptt:$("ptt"),
    sqBtn:$("sqBtn"), soundBtn:$("soundBtn"), testBtn:$("testBtn"), grille:$("grille")
  };

  let nick="", room="", ch=19, client=null;
  const id = Math.random().toString(36).slice(2,8);
  let stream=null, rec=null, chunks=[], sending=false, mime="";
  let actx=null, hissGain=null, out=null, squelch=true;
  let voice=null, keeper=null;
  let peers=new Map(), queue=[], playing=false;

  const say  = (t,dim) => el.status.innerHTML = dim ? `<em>${t}</em>` : t;
  const err  = t => el.status.innerHTML = `<b>${t}</b>`;
  const topic = () => `pr27/${room}/${ch}`;

  /* ---------- base64: darabolva, mert Safari kb. 65k argumentumnal elhasal ---------- */
  function bytesToB64(u8){
    let s = "";
    for(let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000));
    return btoa(s);
  }
  const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));

  /* ---------- hang ---------- */
  function silentWav(){
    const sr=8000, n=sr*1, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
    const w=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i));};
    w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt ");
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,"data"); v.setUint32(40,n*2,true);
    return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
  }

  function audioInit(){
    if(actx) return;
    // <audio> elem a beszedhez: ezt a nemitokapcsolo NEM hallgattatja el
    voice = new Audio(); voice.playsInline = true; voice.setAttribute("playsinline","");
    voice.preload = "auto"; voice.volume = 1; voice.controls = false;
    voice.style.display = "none"; document.body.appendChild(voice);
    // csendes hurok: playback kategoriaban tartja a hang-sessiont
    keeper = new Audio(silentWav()); keeper.loop = true; keeper.volume = 0.001; keeper.playsInline = true;
    keeper.play().catch(()=>{});

    actx = new (window.AudioContext || window.webkitAudioContext)();
    out = actx.createGain(); out.gain.value = 1; out.connect(actx.destination);
    const len = actx.sampleRate*2, b = actx.createBuffer(1,len,actx.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = actx.createBufferSource(); src.buffer = b; src.loop = true;
    const bp = actx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2200; bp.Q=0.6;
    hissGain = actx.createGain(); hissGain.gain.value = squelch ? 0.014 : 0;
    src.connect(bp).connect(hissGain).connect(out); src.start();
  }
  function crackle(dur=0.2, lvl=0.35){
    if(!actx) return;
    const n = Math.floor(actx.sampleRate*dur);
    const b = actx.createBuffer(1,n,actx.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++){
      const t=i/n, env=Math.pow(1-t,2.2)*(0.35+0.65*Math.random());
      d[i]=(Math.random()*2-1)*env*(Math.random()<0.06?2.4:1);
    }
    const s=actx.createBufferSource(); s.buffer=b;
    const f=actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800; f.Q=0.8;
    const g=actx.createGain(); g.gain.value=lvl;
    s.connect(f).connect(g).connect(out); s.start();
  }
  function beep(){
    if(!actx) return;
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.frequency.value=1150;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.16,t+0.01);
    g.gain.setValueAtTime(0.16,t+0.07); g.gain.linearRampToValueAtTime(0,t+0.1);
    o.connect(g).connect(out); o.start(t); o.stop(t+0.12);
  }
  const duck = on => { if(hissGain) hissGain.gain.value = on ? 0 : (squelch?0.014:0); };

  /* ---------- broker ---------- */
  function connect(){
    say("Kapcsolódás…", true);
    client = mqtt.connect(BROKER, {clientId:"pr27_"+id+Math.random().toString(16).slice(2,6), keepalive:30, reconnectPeriod:2000});
    client.on("connect", () => { client.subscribe(topic()); client.subscribe(`pr27/${room}/echo/${id}`); idle(); hb(); });
    client.on("reconnect", () => say("Újrakapcsolódás…", true));
    client.on("close", () => say("Kapcsolat megszakadt.", true));
    client.on("error", e => err("Nincs kapcsolat: " + (e.message||"ismeretlen")));
    client.on("message", (t,p) => { try{ route(t, JSON.parse(p.toString())); }catch(e){ err("Hibás csomag."); } });
    setInterval(hb, HB_MS);
    setInterval(renderRoster, 2000);
  }
  const hb = () => client && client.connected && client.publish(topic(), JSON.stringify({k:"hb", id, nick}));
  const idle = () => say(`${ch}. csatorna – csend`, true);

  function route(t, m){
    if(t.includes("/echo/")){ onEcho(m); return; }
    if(m.id === id) return;
    peers.set(m.id, {nick:m.nick||"?", t:Date.now(), tx:m.k==="tx"});
    renderRoster();
    if(m.k === "tx"){ el.lampRx.classList.add("on"); say(`${esc(m.nick)} adásban…`); }
    if(m.k === "audio"){ queue.push(m); pump(); }
  }
  function renderRoster(){
    const now = Date.now();
    [...peers].forEach(([k,v]) => { if(now-v.t > GONE_MS) peers.delete(k); });
    el.roster.innerHTML = peers.size
      ? [...peers.values()].map(v => `<b class="${v.tx?"tx":""}">${esc(v.nick)}</b>`).join("")
      : "Senki más nincs a csatornán.";
  }
  const esc = s => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

  /* ---------- lejatszas: harom mod, a mukodot megjegyzi ---------- */
  let playMode = localStorage.getItem("pr27.play") || "";

  async function viaElement(src){
    if(!voice) throw new Error("nincs audio elem");
    if(keeper) keeper.pause();
    try{
      voice.src = src;
      voice.load();
      const p = voice.play();
      if(p && typeof p.then === "function") await p;
      await new Promise((res,rej) => {
        let fin = false;
        const cleanup = () => { voice.onended=null; voice.onerror=null; clearTimeout(tm); };
        const ok  = () => { if(fin) return; fin=true; cleanup(); res(); };
        const bad = () => { if(fin) return; fin=true; cleanup();
                            rej(new Error("media error " + ((voice.error&&voice.error.code)||"?"))); };
        const tm = setTimeout(ok, MAX_MS + 3000);
        voice.onended = ok; voice.onerror = bad;
      });
    } finally { if(keeper) keeper.play().catch(()=>{}); }
  }

  async function viaWebAudio(bytes){
    if(!actx) throw new Error("nincs AudioContext");
    if(actx.state === "suspended") await actx.resume();
    const copy = bytes.slice(0).buffer;           // decodeAudioData kiuriti a buffert
    const buf = await new Promise((res,rej) => {
      const r = actx.decodeAudioData(copy, res, rej);
      if(r && typeof r.then === "function") r.then(res, rej);
    });
    await new Promise(res => {
      const s = actx.createBufferSource();
      s.buffer = buf; s.connect(out); s.onended = res; s.start();
    });
  }

  async function playBytes(bytes, mt){
    const type = mt || "audio/mp4";
    const modes = {
      blob: async () => {
        const u = URL.createObjectURL(new Blob([bytes], {type}));
        try{ await viaElement(u); } finally { URL.revokeObjectURL(u); }
      },
      data: async () => viaElement("data:" + type + ";base64," + bytesToB64(bytes)),
      webaudio: async () => viaWebAudio(bytes)
    };
    const keys = Object.keys(modes);
    const order = playMode && modes[playMode] ? [playMode, ...keys.filter(k => k !== playMode)] : keys;
    const fails = [];
    for(const k of order){
      try{
        await modes[k]();
        if(playMode !== k){ playMode = k; localStorage.setItem("pr27.play", k); }
        return k;
      }catch(e){ fails.push(`${k}=${e.name||""}${e.message?" "+e.message:""}`); }
    }
    throw new Error(fails.join(" | "));
  }
  async function pump(){
    if(playing || !queue.length) return;
    playing = true;
    const m = queue.shift();
    el.lampRx.classList.add("on"); duck(true);
    say(`${esc(m.nick)} – vétel`);
    crackle(0.16, 0.4);
    try{
      await new Promise(r => setTimeout(r, 130));
      await playBytes(b64ToBytes(m.d), m.mt);
      crackle(0.18, 0.3); beep();
    }catch(e){
      err(`Nem szólal meg:\n${(e.message||e.name||"hiba").slice(0,110)}`);
    }
    setTimeout(() => {
      playing = false;
      if(queue.length) pump();
      else { el.lampRx.classList.remove("on"); duck(false); idle(); }
    }, 240);
  }

  /* ---------- adas ---------- */
  async function mic(){
    if(stream) return stream;
    if(!navigator.mediaDevices) throw new Error("Nincs mikrofon-API (HTTPS kell)");
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
    mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"]
      .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    return stream;
  }
  function newRec(){
    const o = {audioBitsPerSecond: BITRATE};
    if(mime) o.mimeType = mime;
    return new MediaRecorder(stream, o);
  }
  async function startTx(){
    if(sending || playing) return;
    try{ await mic(); }catch(e){ err("Mikrofon nem elérhető: " + (e.name||e.message)); return; }
    if(actx && actx.state === "suspended") actx.resume();
    sending = true; chunks = [];
    el.ptt.classList.add("live"); el.lampTx.classList.add("on"); duck(true);
    say("Adás – beszélj!");
    if(navigator.vibrate) navigator.vibrate(12);
    client && client.publish(topic(), JSON.stringify({k:"tx", id, nick}));
    try{
      rec = newRec();
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      rec.onstop = () => finishTx().catch(e => err("Küldés meghiúsult: " + (e.name||e.message)));
      rec.start();
      setTimeout(() => sending && stopTx(), MAX_MS);
    }catch(e){ sending=false; el.ptt.classList.remove("live"); el.lampTx.classList.remove("on"); err("Felvétel nem indult: "+(e.name||e.message)); }
  }
  function stopTx(){
    if(!sending) return;
    sending = false;
    el.ptt.classList.remove("live"); el.lampTx.classList.remove("on");
    if(rec && rec.state !== "inactive") rec.stop();
  }
  async function finishTx(){
    duck(false);
    const blob = new Blob(chunks, {type: mime || "audio/mp4"});
    if(blob.size < 1200){ idle(); return; }
    const b64 = bytesToB64(new Uint8Array(await blob.arrayBuffer()));
    const pkt = JSON.stringify({k:"audio", id, nick, mt: blob.type, d: b64});
    if(pkt.length > 800000){ err("Túl hosszú adás. Rövidebben."); return; }
    if(!client || !client.connected){ err("Nincs kapcsolat, az adás nem ment el."); return; }
    client.publish(topic(), pkt, {qos:0}, e => {
      if(e) err("Küldési hiba: " + e.message);
      else { crackle(0.12,0.25); beep(); say(`Elküldve – ${(pkt.length/1024).toFixed(0)} KB`, true); setTimeout(idle, 1500); }
    });
  }

  /* ---------- onteszt ---------- */
  let echoWaiter = null;
  function onEcho(m){ if(echoWaiter) echoWaiter(m); }

  async function selfTest(){
    const log = [];
    const upd = () => el.status.innerHTML = log.join("\n");
    const step = (s,ok,extra) => { log.push(`${ok?"OK ":"HIBA"} ${s}${extra?" – "+extra:""}`); upd(); };
    log.push("ÖNTESZT FUT…"); upd();

    try{ await mic(); step("mikrofon", true, mime||"alap formátum"); }
    catch(e){ step("mikrofon", false, e.name||e.message); return; }

    let blob;
    try{
      const r = newRec(), cs = [];
      r.ondataavailable = e => e.data.size && cs.push(e.data);
      await new Promise(res => { r.onstop = res; r.start(); setTimeout(()=>r.stop(), 2000); });
      blob = new Blob(cs, {type: mime || "audio/mp4"});
      step("felvétel 2 mp", blob.size > 1000, (blob.size/1024).toFixed(1)+" KB");
      if(blob.size <= 1000) return;
    }catch(e){ step("felvétel", false, e.name||e.message); return; }

    let pkt;
    try{
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const b64 = bytesToB64(bytes);
      pkt = JSON.stringify({k:"audio", id, nick, mt:blob.type, d:b64});
      const back = b64ToBytes(b64);
      const same = back.length === bytes.length;
      step("kódolás", same, (pkt.length/1024).toFixed(0)+" KB csomag");
      if(!same) return;
    }catch(e){ step("kódolás", false, e.name||e.message); return; }

    try{
      const t0 = Date.now();
      const got = await new Promise((res,rej) => {
        echoWaiter = res;
        setTimeout(() => rej(new Error("időtúllépés")), 9000);
        client.publish(`pr27/${room}/echo/${id}`, pkt, {qos:0});
      });
      echoWaiter = null;
      step("broker oda-vissza", !!got.d, (Date.now()-t0)+" ms");
    }catch(e){ echoWaiter=null; step("broker", false, e.message); }

    try{
      duck(true); crackle(0.15,0.4);
      const mode = await playBytes(new Uint8Array(await blob.arrayBuffer()), blob.type);
      beep(); duck(false);
      step("lejátszás", true, mode + " módban");
      log.push("Hallottad a saját hangod? Ha nem:"); 
      log.push("némítókapcsoló vagy hangerő."); upd();
    }catch(e){ duck(false); step("lejátszás", false, (e.message||e.name).slice(0,120)); }
    setTimeout(idle, 12000);
  }

  /* ---------- csatorna ---------- */
  function setCh(n){
    const old = topic();
    ch = ((n-1+40)%40)+1;
    el.chNum.textContent = ch;
    peers.clear(); renderRoster(); queue = [];
    if(client && client.connected){ client.unsubscribe(old); client.subscribe(topic()); }
    crackle(0.14,0.3); idle();
    localStorage.setItem("pr27.ch", ch);
  }

  /* ---------- init ---------- */
  el.nick.value = localStorage.getItem("pr27.nick") || "";
  el.room.value = localStorage.getItem("pr27.room") || "";
  ch = +(localStorage.getItem("pr27.ch") || 19);
  el.chNum.textContent = ch;

  el.enter.addEventListener("click", async () => {
    nick = el.nick.value.trim().slice(0,12);
    room = el.room.value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");
    if(!nick || room.length < 3){ el.nick.focus(); return; }
    localStorage.setItem("pr27.nick", nick); localStorage.setItem("pr27.room", room);
    audioInit();
    try{ await mic(); }catch(e){}
    try{ await navigator.wakeLock.request("screen"); }catch(e){}
    el.me.textContent = nick;
    el.setup.classList.add("hide"); el.radio.classList.remove("hide");
    el.grille.textContent = "KÓD: " + room;
    connect();
  });
  el.room.addEventListener("keydown", e => e.key === "Enter" && el.enter.click());
  el.chUp.addEventListener("click", () => setCh(ch+1));
  el.chDn.addEventListener("click", () => setCh(ch-1));

  el.soundBtn.addEventListener("click", async () => {
    if(actx && actx.state === "suspended") await actx.resume();
    keeper && keeper.play().catch(()=>{});
    say("Hangpróba: sercegés + pittyegés.\nHa csend van, a némítókapcsoló néma állásban van.");
    crackle(0.35, 0.5); setTimeout(beep, 450);
    setTimeout(idle, 5000);
  });
  el.testBtn.addEventListener("click", () => selfTest().catch(e => err("Önteszt hiba: "+(e.message||e.name))));
  el.sqBtn.addEventListener("click", () => {
    squelch = !squelch;
    el.sqBtn.classList.toggle("act", squelch);
    duck(false);
  });

  const p = el.ptt;
  p.addEventListener("pointerdown", e => { e.preventDefault(); p.setPointerCapture(e.pointerId); startTx(); });
  p.addEventListener("pointerup",   e => { e.preventDefault(); stopTx(); });
  p.addEventListener("pointercancel", stopTx);
  p.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("visibilitychange", () => { if(document.hidden) stopTx(); });
  window.addEventListener("error", e => err("JS hiba: " + (e.message||"").slice(0,60)));
})();
</script>
</body>
</html>
